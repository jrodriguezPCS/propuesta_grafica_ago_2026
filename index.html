<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0767B1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>PCS For All — Propuesta Gráfica</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { width:100%; background:#e8f3fb; overflow-x:hidden; font-family:Inter,system-ui,sans-serif; }
    header { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px; background:rgba(11,58,110,.94); color:#fff; }
    header strong { font-size:14px; }
    header span { display:block; font-size:12px; opacity:.85; font-weight:400; }
    header button { border:0; background:#ffffff22; color:#fff; border-radius:999px; padding:8px 12px; font-size:12px; cursor:pointer; }
    .stage { position:relative; width:100%; line-height:0; min-height:70vh; }
    .slide { display:block; width:100%; height:auto; pointer-events:none; user-select:none; }
    .shield { position:absolute; inset:0; z-index:2; }
    .status { padding:48px 24px; text-align:center; color:#0b3a6e; font-size:14px; line-height:1.5; }
  </style>
</head>
<body>
  <header>
    <strong>PCS For All<span>Propuesta Gráfica • Redes y Campañas</span></strong>
    <button type="button" id="fs">Pantalla completa</button>
  </header>
  <div class="stage" id="stage">
    <p class="status" id="status">Cargando propuesta actualizada…</p>
    <div class="shield" aria-hidden="true"></div>
  </div>
  <script>
    const VERSION = "20260908e";
    const parts = [
      ["slides/v4/p01_0.txt"],
      ["slides/v4/p02_0.txt","slides/v4/p02_1.txt"],
      ["slides/v4/p03_0.txt","slides/v4/p03_1.txt","slides/v4/p03_2.txt"],
      ["slides/v4/p04_0.txt","slides/v4/p04_1.txt","slides/v4/p04_2.txt"],
      ["slides/v4/p05_0.txt","slides/v4/p05_1.txt"],
      ["slides/v4/p06_0.txt","slides/v4/p06_1.txt","slides/v4/p06_2.txt"],
      ["slides/v4/p07_0.txt","slides/v4/p07_1.txt","slides/v4/p07_2.txt"],
      ["slides/v4/p08_0.txt","slides/v4/p08_1.txt","slides/v4/p08_2.txt"],
      ["slides/v4/p09_0.txt","slides/v4/p09_1.txt"],
      ["slides/v4/p10_0.txt"]
    ];
    const stage = document.getElementById("stage");
    const shield = stage.querySelector(".shield");
    const status = document.getElementById("status");
    Promise.all(parts.map((group) =>
      Promise.all(group.map((src) =>
        fetch(src + "?v=" + VERSION, { cache: "no-store" }).then((r) => {
          if (!r.ok) throw new Error(src + " " + r.status);
          return r.text();
        })
      )).then((chunks) => chunks.join(""))
    )).then((payloads) => {
      status.remove();
      payloads.forEach((b64) => {
        const img = document.createElement("img");
        img.className = "slide";
        img.alt = "";
        img.draggable = false;
        img.width = 1280;
        img.height = 648;
        img.src = "data:image/jpeg;base64," + b64.trim();
        stage.insertBefore(img, shield);
      });
    }).catch((err) => {
      status.textContent = "Subiendo lámina nueva… recarga en unos segundos (Shift+F5). " + err.message;
    });
    const block = (e) => e.preventDefault();
    document.addEventListener("contextmenu", block);
    document.addEventListener("dragstart", block);
    document.getElementById("fs").onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    };
  </script>
</body>
</html>
