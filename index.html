<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0767B1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <title>PCS For All — Propuesta Gráfica</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <style>
    :root { --navy:#0b3a6e; --paper:#e8f3fb; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { width:100%; background:var(--paper); overflow-x:hidden; font-family:Inter,system-ui,sans-serif; }
    header {
      position:sticky; top:0; z-index:10;
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; padding:10px 16px;
      background:rgba(11,58,110,.94); color:#fff;
    }
    header strong { font-size:14px; letter-spacing:0; font-weight:700; }
    header span { display:block; font-size:12px; opacity:.85; font-weight:400; letter-spacing:0; }
    header button {
      border:0; background:#ffffff22; color:#fff; border-radius:999px;
      padding:8px 12px; font-size:12px; cursor:pointer;
    }
    .stage { position:relative; width:100%; line-height:0; }
    .slide {
      display:block; width:100%; max-width:100%; height:auto;
      pointer-events:none;
      user-select:none;
      -webkit-user-select:none;
      -webkit-user-drag:none;
      -webkit-touch-callout:none;
    }
    .shield { position:absolute; inset:0; z-index:2; background:transparent; }
  </style>
</head>
<body>
  <header>
    <strong>PCS For All<span>Propuesta Gráfica • Redes y Campañas</span></strong>
    <button type="button" id="fs">Pantalla completa</button>
  </header>
  <div class="stage" id="stage">
    <div class="shield" aria-hidden="true"></div>
  </div>
  <script>
    const VERSION = "20260908c";
    const parts = [
      "slides/v2/parte-01.b64",
      "slides/v2/parte-02.b64",
      "slides/v2/parte-03.b64",
      "slides/v2/parte-04.b64",
      "slides/v2/parte-05.b64",
      "slides/v2/parte-06.b64"
    ];
    const stage = document.getElementById("stage");
    const shield = stage.querySelector(".shield");
    Promise.all(parts.map((src) =>
      fetch(src + "?v=" + VERSION, { cache: "no-store" }).then((r) => {
        if (!r.ok) throw new Error(src);
        return r.text();
      })
    )).then((payloads) => {
      payloads.forEach((b64) => {
        const img = document.createElement("img");
        img.className = "slide";
        img.alt = "";
        img.draggable = false;
        img.width = 1920;
        img.height = 1620;
        img.src = "data:image/jpeg;base64," + b64.trim();
        stage.insertBefore(img, shield);
      });
    }).catch(() => {
      const img = document.createElement("img");
      img.className = "slide";
      img.alt = "";
      img.draggable = false;
      img.width = 1920;
      img.height = 9720;
      img.src = "slides/slides/propuesta-grafica.jpg?v=" + VERSION;
      stage.insertBefore(img, shield);
    });
    const block = (event) => event.preventDefault();
    document.addEventListener("contextmenu", block);
    document.addEventListener("dragstart", block);
    document.addEventListener("selectstart", block);
    document.getElementById("fs").onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    };
  </script>
</body>
</html>
