<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3a6e">
  <title>Propuesta gráfica — PCSFORALL</title>
  <style>
    :root { --navy:#0b3a6e; --paper:#e8f3fb; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { width:100%; background:var(--paper); overflow-x:hidden; font-family:Inter,system-ui,sans-serif; }
    header {
      position:sticky; top:0; z-index:10;
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; padding:10px 16px;
      background:rgba(11,58,110,.94); color:#fff;
    }
    header strong { font-size:13px; letter-spacing:.12em; }
    header span { display:block; font-size:12px; opacity:.85; font-weight:400; letter-spacing:0; }
    header button {
      border:0; background:#ffffff22; color:#fff; border-radius:999px;
      padding:8px 12px; font-size:12px; cursor:pointer;
    }
    .slide { display:block; width:100%; max-width:100%; height:auto; }
    footer { padding:16px; text-align:center; font-size:12px; color:#4b6480; }
  </style>
</head>
<body>
  <header>
    <strong>PCSFORALL<span>Propuesta gráfica · redes y campañas</span></strong>
    <button type="button" id="fs">Pantalla completa</button>
  </header>
  <img class="slide" id="slide" width="1920" height="9720" alt="Propuesta gráfica PCSFORALL">
  <footer>Javier Esteban Rodríguez Medina · Agosto 2026 · 1920×9720 al 100% del ancho</footer>
  <script>
    const img = document.getElementById("slide");
    const candidates = [
      "slides/propuesta-grafica.jpg",
      "slides/slides/propuesta-grafica.jpg"
    ];
    let i = 0;
    img.onerror = () => {
      i += 1;
      if (i < candidates.length) img.src = candidates[i];
    };
    img.src = candidates[0];
    document.getElementById("fs").onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    };
  </script>
</body>
</html>
